services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promtehnosfera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promtehnosfera}
      POSTGRES_DB: promtehnosfera
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promtehnosfera"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://promtehnosfera:${POSTGRES_PASSWORD:-promtehnosfera}@postgres:5432/promtehnosfera?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate one with: openssl rand -base64 32}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
