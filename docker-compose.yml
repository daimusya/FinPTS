services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promtehnosfera
      # No default: a known password plus an open port would give away the whole database.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - generate one with: openssl rand -hex 24}"
      POSTGRES_DB: promtehnosfera
    ports:
      # Only this server can reach PostgreSQL (migrations and seeding run from the host); not other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promtehnosfera"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://promtehnosfera:${POSTGRES_PASSWORD}@postgres:5432/promtehnosfera?schema=public
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required - generate one with: openssl rand -base64 48}"
      NODE_ENV: production
    ports:
      - "3000:3000"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://promtehnosfera:${POSTGRES_PASSWORD}@postgres:5432/promtehnosfera?schema=public
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups

volumes:
  postgres_data:
  backups:
